services:
  # 1. Main Next.js Web App Service
  - type: web
    name: aris-voss-agent
    env: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

  # 2. Render Native Cron Job: Curation (8:00 AM UTC daily)
  - type: cron
    name: aris-voss-curation-cron
    env: node
    schedule: "0 8 * * *"
    buildCommand: npm install
    startCommand: node -e "fetch(process.env.APP_URL + '/api/cron/curate', {method:'POST'}).then(r=>r.text()).then(console.log).catch(console.error)"
    envVars:
      - key: APP_URL
        fromService:
          type: web
          name: aris-voss-agent
          property: host

  # 3. Render Native Cron Job: LinkedIn Dispatch (11:00 AM & 6:00 PM UTC daily)
  - type: cron
    name: aris-voss-dispatch-cron
    env: node
    schedule: "0 11,18 * * *"
    buildCommand: npm install
    startCommand: node -e "fetch(process.env.APP_URL + '/api/cron/dispatch', {method:'POST'}).then(r=>r.text()).then(console.log).catch(console.error)"
    envVars:
      - key: APP_URL
        fromService:
          type: web
          name: aris-voss-agent
          property: host
